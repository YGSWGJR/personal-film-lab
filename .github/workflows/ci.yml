name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Python test dependencies
        run: python -m pip install numpy opencv-python

      - name: Test detection algorithms and TransNetV2 contracts
        run: |
          python tests/unit/detect/test_detection_algorithms.py
          python tests/unit/detect/test_boundary_fusion.py
          python tests/unit/detect/test_transnetv2_runtime.py
          python tests/unit/detect/test_server_hybrid.py
          python tests/unit/detect/test_eval_transnetv2.py
